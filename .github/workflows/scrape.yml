name: Scrape opportunities
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape.py
        env:
          SHEET_WEBHOOK: ${{ secrets.SHEET_WEBHOOK }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
      - run: |
          git config user.name "impact-radar"; git config user.email "bot@users.noreply.github.com"
          git add docs/data && (git diff --cached --quiet || git commit -m "Update opportunities" && git push)
